name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile
        run: python -m compileall -q swiphie tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify registry artifacts
        run: python -m swiphie verify
